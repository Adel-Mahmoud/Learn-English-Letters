<!DOCTYPE html>
<html>
<head>
    <title>تطبيق إشعارات صحيح</title>
</head>
<body>
    <button id="enableNotifications">تفعيل الإشعارات</button>
    <button id="showNotification">إرسال إشعار</button>

    <script>
        let swReg=null

        navigator.serviceWorker.register('sw.js').then(reg=>{
            swReg=reg
        })

        document.getElementById('enableNotifications').onclick=()=>{
            Notification.requestPermission().then(p=>{
                if(p==='granted'){
                    swReg.showNotification('🎉 مرحباً بك!',{
                        body:'تم تفعيل الإشعارات بنجاح',
                        icon:'logo.png'
                    })
                }
            })
        }

        document.getElementById('showNotification').onclick=()=>{
            if(Notification.permission==='granted'){
                swReg.showNotification('🔔 إشعار تجريبي',{
                    body:'الإشعار يعمل الآن من Service Worker',
                    icon:'logo.png'
                })
            }
        }
    </script>
</body>
</html>
