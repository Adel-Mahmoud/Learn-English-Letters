<!DOCTYPE html>
<html>
<head>
    <title>تطبيق الويب العادي</title>
</head>
<body>
    <button id="enableNotifications">تفعيل الإشعارات</button>
    <button id="showNotification">إرسال إشعار تجريبي</button>

    <script>
        // طلب الإذن لتفعيل الإشعارات
        document.getElementById('enableNotifications').addEventListener('click', () => {
            if (!('Notification' in window)) {
                alert('المتصفح لا يدعم الإشعارات');
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    alert('تم تفعيل الإشعارات بنجاح!');
                    
                    // إرسال إشعار ترحيبي فوري
                    new Notification('🎉 مرحباً بك!', {
                        body: 'شكراً لتفعيل الإشعارات في تطبيقنا',
                        icon: 'logo.png'
                    });
                }
            });
        });

        // إرسال إشعار عند الطلب
        document.getElementById('showNotification').addEventListener('click', () => {
            if (Notification.permission === 'granted') {
                new Notification('إشعار تجريبي', {
                    body: 'هذا إشعار من الويب العادي',
                    icon: 'logo.png'
                });
            } else {
                alert('الرجاء تفعيل الإشعارات أولاً');
            }
        });

        // إرسال إشعار تلقائي عند تحميل الصفحة (إذا كان الإذن مُعطى)
        window.addEventListener('load', () => {
            if (Notification.permission === 'granted') {
                setTimeout(() => {
                    new Notification('مرحباً بعودتك!', {
                        body: 'سعيد برؤيتك مرة أخرى',
                        icon: 'logo.png'
                    });
                }, 2000);
            }
        });
    </script>
</body>
</html>
